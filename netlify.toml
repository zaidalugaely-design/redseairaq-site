[build]
  command         = "rm -rf dist && mkdir -p dist && cp index.html dist/ && cp og-default.jpg dist/ && cp -r netlify dist/ && node scripts/stamp-build-version.js && node scripts/generate-og-pages.js"
  functions       = "netlify/functions"
  publish         = "dist"

[functions]
  node_bundler = "esbuild"

[images]
  remote_images = ["https://glhmmrovxyijtzjaldtf\\.supabase\\.co/.*"]

# ترويسات أمان فعلية — X-Frame-Options وframe-ancestors لا قيمة أمنية لهما كـ<meta>
# بالـHTML (المتصفح يتجاهلهما بصمت بهذه الصيغة، مؤكَّد فعلياً بتحذيرات console).
# CSP هنا مقصودة تبقى مقتصرة على frame-ancestors فقط — بقية السياسة (script-src،
# img-src، إلخ) تبقى مُدارة عبر الـ<meta> بـindex.html كما هي، لتفادي وجود نسختين
# للسياسة الكاملة يمكن أن تتباعدا عن بعض؛ CSP من مصدرين تُطبَّق بتقاطع الأشد تقييداً
# لكل توجيه (AND) فلا خطر بتخفيف أي قيد موجود بالـmeta.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

# SPA catch-all — serves index.html for any path with no matching file
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
